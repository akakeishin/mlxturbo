[project]
name = "mlxturbo"
version = "0.1.0"
description = "Apple Silicon で MLX 推論を速くするエンジン"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "huggingface-hub>=1.28.0",
    "mlx>=0.32.2,<0.33",
    "mlx-lm>=0.31.3,<0.32",
    "uvicorn>=0.52.4",
]

[project.scripts]
mlxturbo = "mlxturbo.cli:main"
mlxturbo-serve = "mlxturbo.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mlxturbo"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
